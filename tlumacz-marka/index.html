<style>
  :root{
    --ink:#0E1B2B;          /* granat — tło główne */
    --ink-2:#122238;        /* granat jaśniejszy — karty */
    --ink-3:#1A2E48;        /* linie, hover */
    --gold:#C9A96A;         /* złoto — akcent */
    --gold-soft:#A98D5C;
    --paper:#F4F1EA;        /* jasne sekcje */
    --paper-2:#EAE5DA;
    --white:#FFFFFF;
    --muted:#8FA0B5;        /* tekst wyciszony na granacie */
    --muted-dark:#6B7280;   /* tekst wyciszony na jasnym */
    --serif:'DM Sans', -apple-system, sans-serif;   /* nagłówki — DM Sans, cięższy stopień */
    --sans:'DM Sans', -apple-system, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--ink);color:var(--white);font-family:var(--sans);font-weight:300;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}

  .wrap{max-width:1180px;margin:0 auto;padding:0 32px}
  .eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:500}
  h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.1;letter-spacing:-.02em}
  .rule{width:44px;height:1px;background:var(--gold);margin:26px 0}

  /* ── nav ── */
  nav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(14,27,43,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(201,169,106,.15)}
  .nav-in{max-width:1180px;margin:0 auto;padding:18px 32px;display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:14px;color:var(--white);text-decoration:none}
  .logo-sig{height:30px;width:auto;display:block}
  .logo-role{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);padding-top:6px}
  .nav-links{display:flex;gap:34px;align-items:center}
  .nav-links a{color:var(--muted);text-decoration:none;font-size:13px;letter-spacing:.08em;text-transform:uppercase;transition:color .2s}
  .nav-links a:hover{color:var(--gold)}
  .lang{display:flex;gap:2px;border:1px solid rgba(201,169,106,.35);border-radius:2px;overflow:hidden}
  .lang button{background:none;border:0;color:var(--muted);font-family:var(--sans);font-size:11px;letter-spacing:.1em;padding:6px 12px;cursor:pointer;transition:.2s}
  .lang button.on{background:var(--gold);color:var(--ink);font-weight:600}

  /* ── hero ── */
  header{min-height:100vh;display:flex;align-items:center;position:relative;overflow:hidden;
    background:linear-gradient(160deg,#0E1B2B 0%,#122238 55%,#0B1522 100%)}
  header::before{content:"";position:absolute;inset:0;background:var(--tex-silk) center/cover no-repeat;opacity:.42}
  header::after{content:"";position:absolute;inset:0;background:
    linear-gradient(105deg, rgba(14,27,43,.92) 0%, rgba(14,27,43,.55) 55%, rgba(14,27,43,.25) 100%),
    radial-gradient(ellipse 60% 50% at 78% 40%, rgba(201,169,106,.07), transparent 60%)}
  .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:center;position:relative;z-index:2;padding-top:140px;padding-bottom:90px}
  .hero-grid > *{min-width:0}
  .hero-title{font-size:clamp(40px,7vw,88px);letter-spacing:.01em;margin:22px 0 0}
  .hero-title em{font-style:italic;color:var(--gold)}
  .hero-values{display:flex;gap:12px 18px;flex-wrap:wrap;margin-top:30px;font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
  .hero-values b{color:var(--gold);font-weight:400}
  .hero-sub{margin-top:34px;max-width:480px;color:#C6D0DC;font-size:17px;font-weight:300}
  .hero-cta{display:inline-flex;gap:16px;margin-top:44px;flex-wrap:wrap}
  .btn{display:inline-block;padding:15px 34px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;transition:.25s;border:1px solid var(--gold)}
  .btn-solid{background:var(--gold);color:var(--ink);font-weight:600}
  .btn-solid:hover{background:transparent;color:var(--gold)}
  .btn-ghost{color:var(--gold)}
  .btn-ghost:hover{background:var(--gold);color:var(--ink)}

  /* photo placeholders — sesja z prawdziwych zdjęć, NIE generatywne */
  .ph{background:linear-gradient(145deg,#16273D,#0D1927);border:1px solid rgba(201,169,106,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;padding:20px}
  .ph svg{opacity:.5}
  .ph small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;line-height:1.8;max-width:230px}
  .hero-ph{aspect-ratio:4/5;max-width:440px;justify-self:end;width:100%}
  .hero-art{max-width:440px;justify-self:end;width:100%;border:1px solid rgba(201,169,106,.25);background:var(--tex-ink) center/cover no-repeat}
  .hero-art svg{display:block;width:100%;height:auto}

  /* ── strip liczby/fakty ── */
  .strip{background:var(--ink-2);border-top:1px solid rgba(201,169,106,.14);border-bottom:1px solid rgba(201,169,106,.14)}
  .strip-in{display:grid;grid-template-columns:repeat(3,1fr);gap:1px}
  .strip-item{padding:38px 40px;text-align:center;border-left:1px solid rgba(201,169,106,.1)}
  .strip-item:first-child{border-left:0}
  .strip-item h3{font-size:24px;color:var(--gold);letter-spacing:.02em}
  .strip-item p{font-size:13px;color:var(--muted);margin-top:8px;letter-spacing:.05em}

  section{padding:110px 0}
  .sec-head{max-width:640px;margin-bottom:64px}
  .sec-head h2{font-size:clamp(34px,4vw,48px);margin-top:20px}

  /* ── o mnie (jasna) ── */
  .light{background:var(--paper);color:var(--ink)}
  .light .sec-head h2{color:var(--ink)}
  .about-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:72px;align-items:start}
  .about-ph{aspect-ratio:3/4;position:sticky;top:110px;background:linear-gradient(145deg,#E3DDD0,#D6CFC0);border:1px solid rgba(169,141,92,.35);color:var(--muted-dark)}
  .about-copy p{margin-bottom:18px;color:#3A4453;font-size:16.5px;line-height:1.55}
  .about-copy .lead{font-family:var(--serif);font-size:26px;line-height:1.3;color:var(--ink);font-style:italic;margin-bottom:26px}
  .sig-img{height:52px;width:auto;margin-top:18px;opacity:.85}
  .has-photo{background-size:cover;background-position:center}
  .has-photo svg,.has-photo small{display:none}

  /* ── usługi ── */
  .services{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
  .svc{background:var(--ink-2);border:1px solid rgba(201,169,106,.16);padding:44px 40px;transition:.25s;position:relative}
  .svc:hover{border-color:rgba(201,169,106,.5);transform:translateY(-3px)}
  .svc .num{font-family:var(--serif);font-style:italic;color:rgba(201,169,106,.4);font-size:20px}
  .svc h3{font-size:26px;margin:14px 0 14px;color:var(--white)}
  .svc p{color:var(--muted);font-size:15px}
  .svc ul{margin-top:16px;list-style:none}
  .svc li{color:#B9C4D2;font-size:14px;padding:7px 0 7px 22px;position:relative;border-top:1px solid rgba(201,169,106,.08)}
  .svc li::before{content:"—";position:absolute;left:0;color:var(--gold)}

  /* ── wartości ── */
  .values-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(201,169,106,.14);border:1px solid rgba(201,169,106,.14)}
  .val{background:var(--ink);padding:44px 36px;text-align:center}
  .val .ico{margin-bottom:18px;display:flex;justify-content:center}
  .val .ico svg{width:38px;height:38px}
  .svc-head{display:flex;justify-content:space-between;align-items:flex-start}
  .svc-ico svg{width:34px;height:34px}
  .wave-rule{display:block;margin:22px 0 4px}
  .val h3{font-size:15px;letter-spacing:.28em;text-transform:uppercase;font-family:var(--sans);font-weight:500;color:var(--gold)}
  .val p{margin-top:14px;font-size:14.5px;color:var(--muted)}

  /* ── pasje (tło, nie motyw) ── */
  .passions{background:linear-gradient(160deg,#0B1522,#122238);position:relative;overflow:hidden}
  .passions::before{content:"";position:absolute;inset:0;background:var(--tex-water) center/cover no-repeat;opacity:.5}
  .passions::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg, rgba(11,21,34,.88) 0%, rgba(11,21,34,.55) 60%, rgba(18,34,56,.75) 100%)}
  .passions .wrap{position:relative;z-index:2}
  .passions-bg{position:absolute;left:0;right:0;bottom:-10px;width:100%;height:auto;z-index:1;pointer-events:none;opacity:.6}
  .passions-note{font-family:var(--serif);font-style:italic;font-size:clamp(26px,3.2vw,38px);max-width:820px;line-height:1.3;color:#D9E1EA}
  .passions-note b{color:var(--gold);font-weight:500}
  .passion-tags{display:flex;gap:14px;margin-top:44px;flex-wrap:wrap}
  .ptag{border:1px solid rgba(201,169,106,.3);padding:10px 22px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

  /* ── proces ── */
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:40px;counter-reset:step}
  .step{position:relative;padding-top:26px}
  .step::before{counter-increment:step;content:"0" counter(step);position:absolute;top:-14px;left:0;font-family:var(--serif);font-style:italic;font-size:46px;color:rgba(169,141,92,.35)}
  .light .step h3{color:var(--ink);font-size:20px;margin-bottom:10px}
  .light .step p{color:#4A5568;font-size:14.5px}

  /* ── referencje ── */
  .refs{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .ref{background:var(--ink-2);border:1px solid rgba(201,169,106,.16);padding:40px}
  .ref .q{font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.4;color:#D9E1EA}
  .ref .who{margin-top:22px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
  .ref .role{font-size:12px;color:var(--muted);margin-top:4px}
  .langs-note{margin-top:26px;font-size:13px;color:var(--muted);letter-spacing:.05em}
  .langs-note b{color:var(--gold);font-weight:500}

  /* ── galeria ── */
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .gallery .ph{aspect-ratio:4/3}
  .gallery .ph.tall{grid-row:span 2;aspect-ratio:auto}
  @media(max-width:900px){.gallery{grid-template-columns:1fr 1fr}}
  @media(max-width:520px){.gallery{grid-template-columns:1fr}.gallery .ph.tall{grid-row:auto;aspect-ratio:4/3}}

  /* ── FAQ ── */
  .faq{max-width:820px}
  .faq-item{border-bottom:1px solid rgba(169,141,92,.25)}
  .faq-item summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;font-family:var(--serif);font-size:21px;color:var(--ink)}
  .faq-item summary::-webkit-details-marker{display:none}
  .faq-item summary::after{content:"+";font-family:var(--serif);color:var(--gold-soft);font-size:26px;flex-shrink:0;transition:.2s}
  .faq-item[open] summary::after{transform:rotate(45deg)}
  .faq-item p{padding:0 0 24px;color:#4A5568;font-size:15.5px;max-width:700px}
  @media(max-width:900px){.refs{grid-template-columns:1fr}}

  /* ── kontakt ── */
  .contact{text-align:center;padding:130px 0}
  .contact h2{font-size:clamp(38px,5vw,60px);margin:22px 0 26px}
  .contact h2 em{font-style:italic;color:var(--gold)}
  .contact p{color:var(--muted);max-width:520px;margin:0 auto 44px;font-size:16px}
  footer{border-top:1px solid rgba(201,169,106,.14);padding:34px 0;font-size:12px;color:var(--muted);letter-spacing:.06em}
  .foot-in{display:flex;justify-content:space-between;align-items:center}

  @media(max-width:900px){
    .hero-grid{grid-template-columns:1fr;padding-top:120px}
    .logo{font-size:17px}
    .hero-ph{justify-self:start;max-width:340px}
    .about-grid,.services{grid-template-columns:1fr}
    .values-grid{grid-template-columns:repeat(2,1fr)}
    .steps{grid-template-columns:1fr 1fr}
    .strip-in{grid-template-columns:1fr}
    .strip-item{border-left:0;border-top:1px solid rgba(201,169,106,.1);padding:28px 16px}
    .nav-links a{display:none}
  }
  @media(max-width:520px){
    .wrap{padding:0 20px}
    .nav-in{padding:14px 20px;gap:10px}
    .nav-links{gap:10px}
    .btn{padding:13px 20px;letter-spacing:.14em}
    .hero-cta{width:100%}
    .hero-cta .btn{flex:1 1 auto;text-align:center;min-width:0}
    .values-grid,.steps{grid-template-columns:1fr}
    .svc{padding:30px 22px}
    .val{padding:32px 20px}
    section{padding:80px 0}
  }
</style>
</head>

/* ── renderer ── */
function get(obj, path){ return path.split('.').reduce((o,k)=>o&&o[k], obj); }

function render(lang){
  const d = BRAND_DATA[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el=>{ const v=get(d, el.dataset.i); if(v!=null) el.textContent=v; });
  document.querySelectorAll('[data-i-html]').forEach(el=>{ const v=get(d, el.dataset.iHtml); if(v!=null) el.innerHTML=v; });

  const svcIcons = ['sim','consec','whisper','training'];
  document.getElementById('services-grid').innerHTML = d.services.items.map((s,i)=>`
    <div class="svc"><div class="svc-head"><span class="svc-ico">${ICONS[svcIcons[i]]||''}</span><span class="num">0${i+1}</span></div><h3>${s.t}</h3><p>${s.d}</p>
    <ul>${s.li.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('');

  const valIcons = ['precision','strategy','discipline','curiosity','composure','growth'];
  document.getElementById('values-grid').innerHTML = d.values.items.map((v,i)=>`
    <div class="val"><div class="ico">${ICONS[valIcons[i]]||''}</div><h3>${v.t}</h3><p>${v.d}</p></div>`).join('');

  document.querySelectorAll('.sec-head .eyebrow').forEach(el=>{
    if(!el.parentElement.querySelector('.wave-rule')) el.insertAdjacentHTML('afterend', WAVE_RULE);
  });

  document.getElementById('passion-tags').innerHTML = d.passions.tags.map(t=>`<div class="ptag">${t}</div>`).join('');

  document.getElementById('steps-grid').innerHTML = d.process.items.map(s=>`
    <div class="step"><h3>${s.t}</h3><p>${s.d}</p></div>`).join('');

  document.getElementById('refs-grid').innerHTML = d.refs.items.map(r=>`
    <div class="ref"><div class="q">${r.q}</div><div class="who">${r.who}</div><div class="role">${r.role}</div></div>`).join('');

  document.getElementById('faq-list').innerHTML = d.faq.items.map(f=>`

function injectJsonLd(d, lang){
  const old = document.getElementById('jsonld'); if(old) old.remove();
  /* Dane strukturalne pod ludzi ORAZ asystentów AI (hipoteza agent-facing-distribution):
     asystent ma dostać jednoznaczną odpowiedź na „kto tłumaczy konferencje z energetyki i prawa" —

  const PERSON_ID = "#slawomir";
  const spec = lang==='pl'
    ? ["tłumaczenia symultaniczne","tłumaczenia konsekutywne","tłumaczenia szeptane","terminologia energetyczna","terminologia prawnicza","szkolenia językowe dla biznesu"]
    : ["simultaneous interpreting","consecutive interpreting","whispered interpreting","energy sector terminology","legal terminology","language training for business"];
  const data = [
    {"@context":"https://schema.org","@type":"Person","@id":PERSON_ID,
     "name":"Sławomir [NAZWISKO]",
     "jobTitle": lang==='pl' ? "Tłumacz konferencyjny" : "Conference interpreter",
     "description": d.hero.sub,
     "knowsLanguage":[{"@type":"Language","name":"Polish","alternateName":"pl"},{"@type":"Language","name":"English","alternateName":"en"}],
     "knowsAbout": spec,
     "hasOccupation":{"@type":"Occupation","name": lang==='pl' ? "Tłumacz konferencyjny" : "Conference interpreter",
       "occupationalCategory":"27-3091.00",

     "makesOffer": d.services.items.map(s=>({"@type":"Offer","itemOffered":{"@type":"Service","name":s.t,"description":s.d}}))},
    {"@context":"https://schema.org","@type":"ProfessionalService","@id":"#uslugi",
     "name": lang==='pl' ? "Tłumaczenia konferencyjne — energetyka i prawo" : "Conference interpreting — energy and law",
     "provider":{"@id":PERSON_ID},
     "areaServed":{"@type":"Country","name":"Poland"},
     "availableLanguage":["pl","en"],
     "serviceType": spec,
     "hasOfferCatalog":{"@type":"OfferCatalog","name": d.services.h2,
       "itemListElement": d.services.items.map(s=>({"@type":"Offer","itemOffered":{"@type":"Service","name":s.t,"description":s.d,
         "serviceOutput": s.li.join("; ")}}))}},
    {"@context":"https://schema.org","@type":"FAQPage",
     "mainEntity": d.faq.items.map(f=>({"@type":"Question","name":f.q,"acceptedAnswer":{"@type":"Answer","text":f.a}}))},
    {"@context":"https://schema.org","@type":"WebSite","name":document.title,
     "inLanguage": lang, "about":{"@id":PERSON_ID},

  ];
  const s = document.createElement('script');

}
